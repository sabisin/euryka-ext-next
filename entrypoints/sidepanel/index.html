<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Euryka</title>
    <style>
      /* Prevent a flash before the theme tokens load. */
      html {
        --initial-background: oklch(1 0 0);
      }
      @media (prefers-color-scheme: dark) {
        html {
          --initial-background: oklch(0.129 0.042 264.695);
        }
      }
      html[data-theme="light"] {
        --initial-background: oklch(1 0 0);
      }
      html[data-theme="dark"] {
        --initial-background: oklch(0.129 0.042 264.695);
      }
      html,
      body {
        margin: 0;
        background-color: var(--initial-background);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
